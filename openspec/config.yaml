schema: spec-driven

context: |
  Team Snek Centaur Platform — spec-first monorepo (pnpm, TypeScript strict,
  Biome, Vitest). Three runtimes: SpacetimeDB (per-game, transient), Convex
  (persistent), Centaur Servers (per-team). See root AGENTS.md for
  implementation conventions and the package map.

  The openspec/specs/ corpus is the BINDING source of truth for system
  behaviour. Knowledge lives in exactly four layers (strict OpenSpec):
  1. specs/<capability>/spec.md — Purpose + Requirements + scenarios (WHAT).
  2. The code — the canonical current HOW, including canonical types.
  3. Each change's design.md — decision rationale, frozen in
     changes/archive/ (the permanent WHY).
  4. This context block — small always-relevant facts only.
  There are no capability-level design documents. If a design choice's
  quality depends on an invariant future implementers could violate, that
  invariant is a REQUIREMENT — mint it in the same change (see rules).

  Identifier grammar (treat like code identifiers):
  - A requirement is `<capability>/<requirement-slug>`; its definition
    header is `### Requirement: <capability>/<slug>` (full path, matching
    the folder). Scenarios are `#### Scenario: #<scenario-slug>` and are
    referenced as `<capability>/<slug>#<scenario-slug>`.
  - Slugs are kebab-case and FROZEN once merged — renames only via RENAMED
    deltas with a same-commit reference sweep (code + specs). The lint
    (`pnpm spec:check`) validates every reference.
  - A requirement declares the identifiers its SOUNDNESS depends on in a
    `Depends on:` line directly under its header — once each, requirement
    grain or scenario grain, omitted entirely when it depends on nothing.
    Requirement PROSE carries no identifiers at all: the sentence names the
    concept, the declaration carries the identifier. It is the capability's
    Purpose declaration at one finer grain, and the capability's must cover
    every capability its requirements depend on.
  - Code cites specs as `// spec: <capability>/<slug>[#<scenario>]` and
    archived decision rationale as `// design: <archived-change-folder>`.
  - Removed requirements' slugs are never re-minted with a different
    meaning; numeric-era identifiers are tombstoned in the identifier map
    (legacy-spec-archive/maps/identifier-map.json).

  Capability dependency rule: a capability's spec may only reference its
  dependencies, never peers or downstream capabilities. Dependencies are
  declared in each Purpose's "Depends on:" sentence (a mint delta declares
  in its Purpose preamble); the lint (pnpm spec:check) enforces the rule —
  a spec may reference only itself and its declared dependencies — and the
  graph's acyclicity. The capability set
  GROWS capability-at-a-time, carved by USER-STORY LOCALITY: a capability
  owns a workflow a user experiences as one thing, and typically draws its
  requirements from several legacy modules (legacy module boundaries were
  implementation sequencing, not semantic delineations). Cross-cutting
  rules no user story owns belong to global-invariants, gated by the
  admission test in its Purpose. global-invariants is a META layer:
  it constrains how concrete capabilities may be shaped, so the citation
  direction is ALWAYS concrete -> gi, never gi -> a user-story capability
  (game-engine is the one exception gi may cite: root domain vocabulary,
  not a story). CITE A GI REQUIREMENT WHEN THIS REQUIREMENT'S SOUNDNESS
  DEPENDS ON IT REMAINING TRUE. The citation graph is a
  soundness-dependency record, not a conformance checklist: conformance to
  gi is universal and implicit (every capability is bound by every
  invariant whether or not it cites one, so the absence of a gi dependency
  NEVER means unconstrained), whereas a citation says "relax this
  invariant and my requirement stops making sense". That is what makes the
  implications of relaxing a gi requirement systematically traceable
  through its dependents — and because gi sits deep in the dependency tree
  and its constraints are the most load-bearing in the corpus, citing it
  FREQUENTLY for this purpose is correct, not over-citation. It should be
  hard to change a rule that many requirements depend on. Corollary: when a
  change mints a new invariant BECAUSE its local solution needs that
  invariant to stay robust, the local requirement declares it. What does
  NOT warrant a declared dependency: a requirement that merely restates or
  specialises a gi rule without depending on it (see the DRY rule below), a
  defensive note that gi permits something, or a pointer used to fill a gap
  the requirement should have specified itself. Declared dependencies are
  an AFFORDANCE, extended whenever a dependency is genuinely warranted —
  never a permanent budget. The capability set was carved in
  full by the 2026-07-24 migration train (planning record:
  docs/spec-migration/); each capability's carving
  decision is recorded in its migration change's proposal.
  Capabilities so far: game-engine — root of the dependency structure, no
  dependencies (module 01, carved as a single capability by author
  decision: it is already a coherent semantic unit — the complete rules of
  the game, independent of storage, networking, and UI; renamed from
  game-rules). global-invariants — the cross-cutting rules no user-story
  capability owns (runtime ownership, authority placement, security/trust
  boundaries, credential scoping; admission test in its Purpose); depends
  on game-engine. test-sequences —
  the UI-free data contract for recorded resolver runs (canonical encoding,
  validation, production seed derivation, halt-at-first-divergence
  replay-check); depends on game-engine. visual-tester — the dedicated dev
  app for authoring board state, staging moves, engine-driven simulation,
  and running saved Test Sequences with discrepancy annotation; depends on
  game-engine and test-sequences (leaf capability).

  MIGRATION COMPLETE (2026-07-24): the legacy corpus
  (legacy-spec-archive/) is fully historical. Every numeric id is
  tombstoned in legacy-spec-archive/maps/identifier-map.json — the sole
  bridge to the past. Citing a numeric id anywhere is a lint error. Each
  entry states what became of the id (disposition: authored / mechanism /
  dropped) and where its substance now lives (carriedBy — one element per
  home, naming the target requirement and the authoring change; several
  homes is ordinary, since re-authoring at intent grain splits numeric
  requirements across capabilities). authored needs >= 1 home with a
  resolving target; dropped must carry NOWHERE and give a reason; every
  non-authored entry needs a reason. Rules: scripts/identifier-map.mjs;
  completeness against the corpus: pnpm spec:audit. The map is kept LIVE
  and linted for the rest of the current implementation-planning PR — a
  correspondence check that large refactors preserve the legacy spec's
  intent, freely edited to stay accurate — and both it and the legacy
  corpus are slated for deletion in a future PR
  (docs/spec-migration/README.md). Sixteen
  capabilities exist as OPEN CHANGES until each is implemented and
  archived (the archive-due gate); the migration's planning artifacts
  are archived under docs/spec-migration/.

  Authoring grain (intent grain): one behaviour per requirement, stated in
  1-3 plain sentences an author can vet at a read; edge-case semantics are
  carried by named scenarios (each one a case someone would be upset to see
  broken — never a restatement); mechanism belongs in code, with rationale
  in the change's design.md. A capability's Requirements section should be
  readable end-to-end in one sitting. Spec bodies state current truth only —
  no journey narration, and NEVER any reference to legacy-spec-archive,
  numeric-era identifiers, or implementation locations (lint-enforced):
  the identifier map is the sole bridge to the past, and code cites specs,
  never the reverse.

  Change lifecycle: propose → the human author reviews the change artifacts
  (Open Questions resolved, deltas approved) → implement — the code and the
  still-open change folder land in the same PR, and the reference lint
  resolves citations against specs/ OVERLAID with open changes' deltas, so
  code may already cite identifiers the deltas introduce or rename →
  archive → merge. Archiving is the terminal act of a change and the only
  way specs/ advances on SUBSTANCE (the lone exception is a mechanical
  GRAMMAR migration, which moves no requirement's meaning — see
  openspec/README.md) — and it means IMPLEMENTED: specs/ records how the
  system behaves, so a change archives at the tail of the PR that
  completes its implementation, in capability-dependency order (fold
  refuses a delta citing a capability that exists only as an open
  change). Open changes are a first-class state; any number may live on
  main while their implementation tasks remain unfinished. The
  archive-due gate (scripts/check-open-changes.mjs; CI status
  no-archive-due-changes) blocks merge of a PR that leaves an open change
  with zero unchecked tasks outside its final "## Archive" section.
  Archiving is executed only on an explicit human instruction:
  an AI agent SHOULD point out when every thread is resolved and the change
  looks ready to archive, but MUST NEVER archive unprompted. Mechanics:
  `pnpm spec:fold <change>` (full-block delta folding, gated on seed
  freshness) then `openspec archive --skip-specs -y <change>` (validate +
  move the folder) — never stock `openspec archive` spec application, whose
  scenario-presence guard rejects the scenario removals/renames that
  full-block authoring expresses legitimately.

  Concurrency: `openspec archive` replaces MODIFIED blocks by header match
  with NO three-way merge, so a delta authored against a stale base can
  silently clobber an interleaved edit. A single PR MAY carry several open
  changes (a change train) — each in its own folder with its own design.md,
  authored in its own commit(s) — when they touch disjoint requirement sets
  and mint distinct capabilities; the reference lint overlays EVERY open
  change's deltas, so cross-change references resolve while all are open.
  Guards: the reference lint fails
  when two open changes touch the same requirement, and pnpm spec:freshness
  verifies each open change's seeded blocks (the seed commit of two-commit
  authoring) still match specs/ — spec:fold enforces the same check as a
  hard precondition, so a stale fold cannot happen even if the continuous
  runs were skipped. Because open changes may outlive their authoring
  PR, specs/ can advance under any of them whenever another change
  archives — and rebasing a PR onto an advanced main is the same event.
  On staleness, re-seed (rewrite the seed/edit pair against the new base)
  and have the word-diff re-reviewed.

rules:
  proposal:
    - If you encounter an ambiguity, contradiction, gap, or are proposing an
      addition beyond what settled sources say, record it in an
      "## Open Questions" section (Context / Question / Options) — do not
      silently resolve it. Open Questions must be resolved by a human before
      specs deltas are created; record the Decision in place when resolved.
  specs:
    - 'A capability''s Purpose is amended ONLY through a "## MODIFIED
      Purpose" delta section — the sole way its "Depends on:" declaration
      can change, so a change that needs a new dependency declares it
      there rather than editing specs/ outside the change machinery.
      Full-block and seeded like a MODIFIED requirement (two-commit
      seed/edit pair), and at most one open change may amend a given
      capability''s Purpose. A "## Purpose" PREAMBLE is the different
      thing: it mints a capability that has no spec.md yet.'
    - 'DO NOT RESTATE a constraint another requirement — global-invariants
      or a peer — already cleanly implies. Duplicated constraints drift into
      conflict, and the copy has no authority. Cite the owning requirement
      where soundness depends on it, and pin the INTEGRATION of the local
      requirement with the constraints bearing on it in design.md, which is
      also a legitimate home for a gi citation: design and implementation
      are as subject to global-invariants as the spec is, so a decision
      motivated by an invariant (which runtime holds a record, why an
      absolute is safe) cites it there rather than over-pinning the
      requirement.'
    - New requirements take a fresh kebab-case slug under their capability;
      never re-mint a removed slug or a tombstoned numeric identifier.
    - Requirement headers and scenario slugs are frozen once merged; renames
      only via RENAMED deltas plus a same-commit sweep of every reference
      (run pnpm spec:check to find them).
    - "CAPABILITY RENAME: rename a whole capability (folder + every
      requirement prefix) from within a change — the new capability's delta
      opens with a `## RENAMES CAPABILITY: <old>` directive above its
      `## Purpose` preamble and is otherwise ADDED-only. The overlay resolves
      both names while the change is open; spec:fold moves the folder and
      re-prefixes at archive. Record the rename in
      openspec/maps/identifier-lineage.json."
    - MODIFIED deltas must copy the ENTIRE requirement block — header, body,
      the `Depends on:` declaration, and all scenarios — then edit.
    - "STRUCTURAL SOUNDNESS DEPENDENCIES: a requirement's dependencies are
      data, not prose. Declare them in a `Depends on:` line directly under
      the requirement header (`<capability>/<slug>[#<scenario>]`, comma
      separated, one sentence ended by a period, each identifier ONCE — a
      requirement-grain entry subsumes its own scenarios); omit the line when
      the requirement depends on nothing. An identifier anywhere in
      requirement prose is a lint error: reword the sentence to name the
      concept. When a dependency reaches a capability the owning capability
      does not declare, extend the Purpose via `## MODIFIED Purpose` — the
      declared list is an affordance, never a budget."
    - "REGENERATE THE GRAPH VIEW whenever a dependency changes. Adding,
      removing or re-pointing a `Depends on:` — at either grain, in specs/
      or in a delta — moves the capability graph, so run `pnpm spec:graph`
      in the same commit and include openspec/capability-graph.md in it.
      That file is GENERATED: never hand-edit it, and never resolve a
      conflict in it by hand — rerun the command. `pnpm spec:check` fails
      while it is stale, so a forgotten regeneration is caught in CI, not
      in review."

    - "NEW-CAPABILITY DELTAS: a delta file for a capability with no existing
      specs/<capability>/spec.md mints that capability. It must open with a
      `## Purpose` preamble (the capability's Purpose section, including its
      'Depends on:' line) above `## ADDED Requirements`, and must be
      ADDED-only — spec:fold creates the capability's spec.md from it at
      archive time. The preamble is the explicit mint marker: a missing
      capability without one is treated as a typo'd folder name and fails
      the freshness check, and a preamble whose capability already exists
      fails it too (another change minted the capability first — reconcile
      the Purpose by hand and drop the preamble). Include a task to add the
      minted capability to this file's context-block capability list at
      archive."
    - "TWO-COMMIT DELTA AUTHORING (AI responsibility): introduce a delta
      that modifies existing requirements across exactly two commits — the
      first seeds the delta file with the affected requirement blocks copied
      VERBATIM from specs/, the second applies the edits — so the second
      commit's diff is a native word-level review diff of the requirement
      changes. If the deltas are revised later (e.g. review feedback),
      rewrite history to keep the seed/edit pair intact instead of stacking
      correction commits. Agent shells have no TTY for an interactive
      rebase — do the rewrite with the scripted-rebase tooling (AGENTS.md,
      'Scripted history rewriting')."
  design:
    - "CONSTRAINT-MINING (mandatory final step): for each decision, ask —
      does its quality depend on an invariant future implementers could
      silently violate? Every yes becomes an ADDED requirement (minimally
      constraining, with a scenario) in THIS change's specs deltas."
    - Every decision should state what breaks if reversed; alternatives
      considered stay here (the archive is the permanent record — spec
      bodies never carry rationale).
    - 'Performance-motivated choices are plastic, not requirements. Warn
      future implementers via doc comments on the interfaces they protect,
      referencing this change ("// design: <archived-change-folder>") so
      reconsidering the choice loads the insight that produced it.'
    - A change MAY exist to formalize design documentation alone (design.md
      + tasks, no spec deltas) — e.g. when implementing from the legacy
      spec's Design sections and the rationale needs a citable archive home.
  tasks:
    - 'ARCHIVE SECTION (archive-due gate contract): tasks.md ends with a
      final "## Archive" section holding the archive-time bookkeeping
      (spec:fold + openspec archive, config.yaml capability list). Only
      tasks OUTSIDE that section count toward completion: a change with
      zero unchecked non-Archive tasks is archive-due and must be
      archived by the PR that reached that state. Keep at least one real
      unchecked implementation task outside "## Archive" until the work
      actually ships.'
    - 'Include a task to add/update "// spec:" citations for code touched,
      and "// design:" references where performance/architecture insight
      warrants them (finalize these when the change is archived, since the
      archive folder name carries the date prefix).'
    - Include a task to run `pnpm spec:check` (validation + reference lint)
      before the change is considered complete.
    - 'DEPENDENCY DECLARATIONS ARE CROSS-CAPABILITY ONLY: a requirement never
      declares a "Depends on:" entry naming a requirement in its own
      capability. Requirements within a capability are one integrated cohort —
      reviewing a change to one against all of them is a tractable local
      analysis — so the edge carries no information, while forbidding it is
      what makes capability-grain cycle detection sufficient. Cross-capability
      entries additionally require the owning capability to declare that
      capability in its Purpose. Lint-enforced (pnpm spec:citations).'
    - 'NO CHANGE IS OFF THE TABLE — ONLY MORE OR LESS EXPENSIVE. A constraint in
      these rules bounds what one change may do, never what the corpus may
      become: a folded capability can be amended, a Purpose can gain a
      dependency, a requirement can move, an identifier can be renamed. Before
      concluding that something "cannot" be done, restate it as what it would
      cost — a second change, a RENAMED delta with a reference sweep, a
      re-seeded pair — and check the restatement is true. If the most correct
      shape is expensive, RAISE IT with the cheaper alternatives; never adopt a
      workaround silently on the belief that the correct shape is forbidden,
      and never let such a belief become a premise in an argument for placing a
      requirement somewhere. (Worked example: one open change may not amend a
      Purpose another open change is amending — which says nothing about the
      change already amending that capability, and mistaking the two put a
      requirement in the wrong capability.)'
    - 'A CAPABILITY DOES NOT OWN A SECTION OF CODE: a capability may require
      that a fact it understands appears in a UI context another capability is
      primarily responsible for building. Author the obligation in the
      capability that understands the fact, declare the dependency in that
      direction (it depends on the surface existing), and do NOT restate it in
      the owning capability — that is the DRY failure, and it puts the rule
      where the capability that cares about it cannot state it. Implementation
      arrives as a diff to that surface citing the imposing requirement.'
    - 'A NO-SECOND-IMPLEMENTATION RULE IS A GLOBAL INVARIANT, not a requirement
      of the capability that provides the resource. Forbidding a duplicate of a
      shared thing — the engine, the board generator, any future one — is a
      negative constraint on what must not be done ANYWHERE in the system, so
      it binds every consumer and no single capability owns it: gi admission
      prongs (a) and (b) both hold, and the provider''s own capability is the
      one place the rule is NOT about. The provider states what the thing is;
      global-invariants states that there is only one of it. Precedent:
      global-invariants/one-shared-engine and
      global-invariants/one-shared-generation, which sit together for this
      reason and not by analogy.'
    - 'A GLOBAL-INVARIANTS CHANGE GETS ITS OWN CHANGE AND ARCHIVES IN THE PR
      THAT OPENS IT. Never carry a gi requirement inside a change that has an
      implementation phase. gi prescribes nothing to build itself, so its
      change has nothing to wait on — and an UNFOLDED invariant binds only the
      change carrying it. It never reaches specs/, so it constrains none of the
      other open changes and nothing that opens while it waits, however
      emphatically its prose says it binds everything. Precedents:
      extend-global-invariants, adopt-federated-trust-invariants,
      adopt-mirror-and-generation-invariants. Enforcement is each dependent''s
      obligation, verified at THAT dependent''s archive — never a precondition
      of archiving gi. (Worked example: one-shared-generation was drafted
      inside a substrate mint that will not archive until a runtime bootstrap
      is built. Board generation was then extracted into its own package while
      the invariant forbidding a second generator existed nowhere in the
      binding corpus, cited five times and enforced by nothing.)'
    - 'ASK WHAT A PLACEMENT OBLIGES, NOT WHICH CHANGE MAY CARRY IT. A
      permission test will confirm a placement a purpose test rejects, and it
      is the easier question to answer, so it is the one you will drift into.
      "Which open change is allowed to hold this?" has a crisp answer from the
      rules above — one change per Purpose, this one already amends that
      capability, the slot is taken. "What does holding this oblige?" is the
      question that decides correctly. Whenever a placement argument''s load is
      carried by a rule about what is PERMITTED, stop and re-derive it from
      what the requirement is FOR. Both known instances of this error are
      recorded: this one, and the false-cannot readings corrected across the
      corpus.'
    - 'IDENTIFIERS IN A PLAN ARE LINTED: tasks.md cites the requirements each
      task discharges, and every identifier must resolve against specs/
      overlaid with the open changes (pnpm spec:citations). Cite them inline
      — the no-identifiers-in-prose rule binds spec and delta files, not task
      plans. When a delta edit renames or drops a requirement, fix the
      change''s own tasks.md in the same commit.'
    - 'TASK NUMBERS ARE A CONTIGUOUS SEQUENCE, not labels. Sections run 1..K in
      order; each task''s major number is its section''s; a section''s minors
      run 1..J in order; the final `## Archive` section is unnumbered in its
      heading and continues the sequence. Deleting a task means RENUMBERING the
      ones after it and sweeping any prose that named them, not leaving the
      hole — a gap is the fingerprint of a task removed without anyone checking
      whether its substance was rehomed, and task numbers are how a plan and
      its design.md refer to each other, so a stale one silently repoints prose
      at a different task. A section may be emptied deliberately (keep the
      heading and say where the work went); an empty section is fine, a hole
      inside one is not. Lint-enforced (pnpm spec:citations).'
    - 'THE IDENTIFIER MAP IS A LIVE CORRESPONDENCE CHECK, not a frozen
      migration-completion ledger. It records where each legacy id''s
      substance now lives, and a change MAY adjust its own affected
      carriedBy entries FREELY — adding a home, retargeting one, splitting
      substance across two — whenever the edit keeps that record accurate
      as the capabilities are refactored. The purpose it now serves is the
      standing sanity check that a large refactor has not lost the intent
      the legacy spec communicated: an entry that has drifted from where
      the substance really lives is the defect, and correcting it is the
      point, not a violation. What still binds: the map stays COMPLETE
      (every legacy id keeps its entry, with a disposition) and every
      target must RESOLVE — pnpm spec:audit enforces both, so a change
      that removes or renames a requirement carriedBy points at must
      retarget it in the same change. The disposition still constrains the
      array (authored needs >= 1 resolving home; dropped carries nowhere,
      with a reason). An entry whose substance genuinely spans two homes
      carries a short "part" note on each saying which half that home
      holds (see 04-REQ-071, 06-REQ-004). Note the trajectory
      (docs/spec-migration/README.md): the legacy corpus and this map are
      deliberately kept live and linted for the rest of this PR, and are
      slated for deletion in a future one.'
